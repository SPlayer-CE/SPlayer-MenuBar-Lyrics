name: Bug report
description: Something is not working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include the diagnostic report from **Settings → About → Copy diagnostics** (remove anything private first).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Play a track in SPlayer-Next
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.5"
    validations:
      required: true

  - type: input
    id: splayer
    attributes:
      label: SPlayer-Next version
      placeholder: "1.2.0-nightly.990"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: Paste the output of Settings → About → Copy diagnostics.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using the latest release.
          required: true
        - label: I searched existing issues before opening this one.
          required: true
